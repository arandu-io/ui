name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.26"), and setup-go installs exactly that -- 1.26.0, whose
          # standard library carries vulnerabilities fixed later. govulncheck
          # below is right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against.
          go-version: stable

      # A formatting difference is a failure, not a comment on a pull request.
      - name: gofmt
        # `gofmt -l .` skips nothing, and what this module publishes is not all
        # valid Go on purpose:
        #
        #   testdata/    the golden files, which are the published output --
        #                including .kyse.go views, which gofmt refuses
        #   *.kyse.go    kyse sources; the compiler excludes them by build tag,
        #                and gofmt does not read build tags
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The one test in the suite that is allowed to skip, run again where a skip
      # must not read as a pass.
      #
      # It compiles the ten Go files this kit publishes against the framework
      # tag a project actually gets, and it skips when that tag is neither in the
      # module cache nor reachable. On a laptop with no network that is the
      # honest answer; here it means the release went out uncompiled, which is
      # the defect the test exists to prevent.
      - name: the published kit compiles against the published framework
        run: |
          set -euo pipefail
          go test -v -run '^TestEveryGoFileTheKitPublishesCompilesAgainstThePublishedFramework$' . \
            | tee "$RUNNER_TEMP/gate.log"
          if grep -q '^--- SKIP' "$RUNNER_TEMP/gate.log"; then
            echo "the gate skipped: nothing was compiled against the published framework, and that is not a pass"
            exit 1
          fi

      # The layout of the suite, checked by command rather than by review. The
      # first of its four checks is the one worth a CI step: a file named
      # PublishTest.go compiles as ordinary code and runs no tests, so the way
      # this fails is a green build with the suite switched off.
      - name: test layout
        run: bash tests/test-layout-guard.sh

      # The golden files ARE the product: they are the bytes that land in
      # somebody's project. A change to them has to show up as a diff in review
      # rather than as a surprise in a checkout, so a run that rewrites them and
      # leaves the tree dirty is a failure.
      - name: the golden files are the ones in the tree
        run: |
          go test . -update
          if [ -n "$(git status --porcelain testdata)" ]; then
            echo "the golden files do not match what the templates produce:"
            git --no-pager diff --stat testdata
            exit 1
          fi

      # This module takes one dependency, and the list is closed.
      #
      # It is run as `go run github.com/arandu-io/ui@latest auth`, from inside
      # somebody's project, so every require here is something they download in
      # order to publish. One earns its place: the merge that carries a custom
      # block through a republish answers "was the file I edited overwritten?",
      # and a second copy of that algorithm here would answer it differently the
      # first time either side changed. The renderer is still a copy of the
      # CLI's, for the reason written above it in publish.go.
      #
      # The check reads the require directives rather than counting them, so a
      # second dependency fails the build and the one that is allowed does not.
      - name: one dependency, and it is the publishing engine
        run: |
          set -euo pipefail
          unexpected=$(awk '
            /^require \(/                       { block = 1; next }
            block && /^\)/                      { block = 0; next }
            block && $1 != "" && $1 !~ /^\/\// { print $1; next }
            /^require [^(]/                     { print $2 }
          ' go.mod | grep -vx 'github.com/arandu-io/hesape' || true)
          if [ -n "$unexpected" ]; then
            echo "this module took a dependency beyond the publishing engine:"
            echo "$unexpected"
            exit 1
          fi

      - name: no Node
        run: |
          found=$(find . -name package.json -o -name node_modules -o -name 'vite.config.*' | grep -v '^./.git' || true)
          if [ -n "$found" ]; then
            echo "Node entered the view layer:"
            echo "$found"
            exit 1
          fi

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
